<title>Energization Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f3; --border:#d8dce2;
    --text:#1a2029; --text-dim:#5b6472; --text-faint:#8891a0;
    --accent:#2f6fed; --accent-dim:#e8eefd;
    --ok:#1f9d55; --ok-bg:#e6f7ec;
    --warn:#c78a12; --warn-bg:#fbf1de;
    --danger:#d64545; --danger-bg:#fbe9e9;
    --idle:#8891a0; --idle-bg:#eef0f3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12161d; --surface:#181e27; --surface-2:#1f2632; --border:#2b3341;
      --text:#e7eaf0; --text-dim:#a3acbc; --text-faint:#6d7688;
      --accent:#5b8dfc; --accent-dim:#1c2b4d;
      --ok:#3ecb7a; --ok-bg:#12301f;
      --warn:#e0ab3f; --warn-bg:#332809;
      --danger:#f0685f; --danger-bg:#3a1616;
      --idle:#7b8494; --idle-bg:#232a36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12161d; --surface:#181e27; --surface-2:#1f2632; --border:#2b3341;
    --text:#e7eaf0; --text-dim:#a3acbc; --text-faint:#6d7688;
    --accent:#5b8dfc; --accent-dim:#1c2b4d;
    --ok:#3ecb7a; --ok-bg:#12301f;
    --warn:#e0ab3f; --warn-bg:#332809;
    --danger:#f0685f; --danger-bg:#3a1616;
    --idle:#7b8494; --idle-bg:#232a36;
    color-scheme: dark;
  }

  @font-face{
    font-family:"IBM Plex Mono";
    src:local("IBM Plex Mono");
  }
  * { box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    margin:0; min-height:100%;
  }
  code, .mono{ font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace; }

  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:12px max(14px,env(safe-area-inset-left,0px)) 12px max(14px,env(safe-area-inset-right,0px));
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header h1{ font-size:16px; margin:0; font-weight:700; letter-spacing:-.01em; }
  header .sub{ font-size:12px; color:var(--text-faint); }
  header .spacer{ flex:1; }

  .stats{ display:flex; gap:8px; flex-wrap:wrap; }
  .stat{
    display:flex; align-items:baseline; gap:5px;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:7px; padding:5px 10px; font-size:12px; color:var(--text-dim);
  }
  .stat b{ font-size:13px; color:var(--text); font-variant-numeric:tabular-nums; }
  .stat.ok b{ color:var(--ok); } .stat.warn b{ color:var(--warn); } .stat.danger b{ color:var(--danger); }

  .toolbar{
    padding:14px 14px 8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  input[type=search]{
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:11px 12px; font-size:16px; color:var(--text);
  }
  input[type=search]:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  select{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 10px; font-size:14px; color:var(--text); min-height:40px;
  }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 10px; -webkit-overflow-scrolling:touch; }
  .chip{
    font-size:12px; padding:7px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); cursor:pointer; user-select:none;
    min-height:32px; display:flex; align-items:center;
  }
  .chip[aria-pressed="true"]{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); font-weight:600; }

  main{ padding:6px 14px 40px; max-width:1100px; margin:0 auto; }
  .empty{ text-align:center; color:var(--text-faint); padding:60px 20px; font-size:13px; }

  .row{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    margin-bottom:8px; overflow:hidden;
  }
  .row-head{
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;
    min-height:44px; flex-wrap:wrap;
  }
  .row-head:hover{ background:var(--surface-2); }
  .status-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .status-dot.not_energized{ background:var(--idle); }
  .status-dot.loto_applied{ background:var(--danger); }
  .status-dot.energized{ background:var(--warn); }
  .status-dot.verified{ background:var(--ok); }

  .row-name{ font-size:13px; font-weight:600; word-break:break-all; }
  .row-meta{ font-size:11.5px; color:var(--text-faint); margin-left:auto; text-align:right; white-space:nowrap; }
  .row-type{ font-size:11px; color:var(--text-dim); background:var(--surface-2); border-radius:5px; padding:2px 7px; flex:none; }
  .chev{ color:var(--text-faint); font-size:11px; transition:transform .15s; flex:none; }
  .row[data-open="true"] .chev{ transform:rotate(90deg); }

  .row-body{ display:none; padding:0 14px 14px; border-top:1px solid var(--border); }
  .row[data-open="true"] .row-body{ display:block; }

  .status-select-wrap{ display:flex; align-items:center; gap:8px; padding:12px 0 10px; flex-wrap:wrap; }
  .status-select-wrap label{ font-size:11.5px; color:var(--text-faint); }
  .status-select{
    display:flex; gap:6px; flex-wrap:wrap;
  }
  .status-btn{
    font-size:12px; padding:8px 12px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); cursor:pointer; min-height:36px;
  }
  .status-btn[data-active="true"].not_energized{ background:var(--idle-bg); color:var(--idle); border-color:var(--idle); }
  .status-btn[data-active="true"].loto_applied{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger); }
  .status-btn[data-active="true"].energized{ background:var(--warn-bg); color:var(--warn); border-color:var(--warn); }
  .status-btn[data-active="true"].verified{ background:var(--ok-bg); color:var(--ok); border-color:var(--ok); }

  .blocked-note{
    font-size:11.5px; color:var(--danger); background:var(--danger-bg);
    border:1px solid var(--danger); border-radius:7px; padding:7px 10px; margin:2px 0 10px;
  }

  .chain{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .chain{ grid-template-columns:1fr; } }
  .chain h4{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:0 0 6px; }
  .taglist{ display:flex; flex-direction:column; gap:4px; }
  .tag-link{
    font-size:12px; padding:8px; border-radius:6px; background:var(--surface-2);
    display:flex; align-items:center; gap:6px; cursor:pointer; border:1px solid transparent;
    min-height:36px; word-break:break-all;
  }
  .tag-link:hover{ border-color:var(--border); }
  .tag-empty{ font-size:12px; color:var(--text-faint); font-style:italic; }

  .meta-line{ font-size:11.5px; color:var(--text-dim); margin-top:8px; line-height:1.7; }
  .meta-line span{ color:var(--text-faint); }

  .notes-section{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .notes-section h4{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); margin:0 0 8px; }
  .note-item{
    background:var(--surface-2); border-radius:7px; padding:8px 10px; margin-bottom:6px;
    font-size:12.5px; line-height:1.5;
  }
  .note-item .note-ts{ font-size:10.5px; color:var(--text-faint); display:block; margin-bottom:2px; }
  .note-item .note-del{
    float:right; color:var(--text-faint); cursor:pointer; font-size:11px; padding:2px 6px;
  }
  .note-add{ display:flex; gap:8px; margin-top:8px; align-items:flex-end; flex-wrap:wrap; }
  .note-add textarea{
    flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:7px;
    padding:9px 10px; font-size:13px; color:var(--text); resize:vertical; min-height:56px; font-family:inherit;
  }
  .note-add textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .note-add button{
    background:var(--accent); color:#fff; border:none; border-radius:7px; padding:10px 14px;
    font-size:13px; font-weight:600; cursor:pointer; min-height:40px;
  }
  .note-add button:disabled{ opacity:.5; cursor:default; }
  .note-badge{
    display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
    border-radius:50%; background:var(--accent-dim); color:var(--accent); font-size:9.5px; font-weight:700;
    flex:none;
  }

  footer{ text-align:center; padding:20px 16px; font-size:11px; color:var(--text-faint); }
  .export-btn{
    background:none; border:1px solid var(--border); border-radius:7px; color:var(--text-dim);
    font-size:11px; padding:6px 12px; cursor:pointer; margin-top:8px;
  }

  /* --- phone-width hardening --- */
  @media (max-width:480px){
    header{ padding:10px 12px; gap:8px; }
    header h1{ font-size:15px; }
    header .sub{ font-size:11px; }
    .stats{ width:100%; gap:6px; }
    .stat{ padding:4px 8px; font-size:11px; flex:1 1 auto; justify-content:center; }
    .toolbar{ padding:10px 12px 6px; }
    input[type=search]{ min-width:0; width:100%; }
    .toolbar select{ flex:1 1 calc(50% - 5px); width:auto; min-width:0; }
    .chip-row{ padding:0 12px 8px; overflow-x:auto; flex-wrap:nowrap; }
    .chip{ flex:none; }
    main{ padding:6px 10px 32px; }
    .row-head{ padding:12px; gap:8px; }
    .row-name{ font-size:12.5px; }
    .row-meta{ width:100%; margin-left:24px; text-align:left; }
    .row-type{ order:5; }
    .status-select{ width:100%; }
    .status-btn{ flex:1 1 calc(50% - 6px); text-align:center; }
    .meta-line{ display:flex; flex-direction:column; gap:2px; }
  }
</style>

<header>
  <div>
    <h1>Energization Tracker</h1>
    <div class="sub">AUS01 — dependency-aware equipment status</div>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search tag, type, room, system, or subsystem…" autocomplete="off">
  <select id="facilityFilter"><option value="">All facilities</option></select>
  <select id="systemFilter"><option value="">All systems</option></select>
  <select id="subsystemFilter"><option value="">All subsystems</option></select>
</div>
<div class="chip-row" id="statusChips"></div>

<main>
  <div id="list"></div>
  <div class="empty" id="emptyMsg" hidden>No equipment matches this filter.</div>
</main>

<footer>
  Status and notes are saved in this browser only, per device. 3,929 equipment nodes from the AUS01 equipment register.<br>
  <button class="export-btn" id="exportNotesBtn">Export all notes (.txt)</button>
</footer>

<script>
(function(){
  "use strict";

  var STATUS_ORDER = ["not_energized","loto_applied","energized","verified"];
  var STATUS_LABEL = {
    not_energized: "Not energized",
    loto_applied: "LOTO applied",
    energized: "Energized",
    verified: "Verified"
  };

  var graph = null;     // { nodes: {...} }
  var nodeNames = [];
  var statusOverride = {}; // localStorage-backed status map, keyed by tag
  var notesStore = {};     // localStorage-backed notes map: tag -> [{text, ts}, ...]

  // The register uses two different codes for the same physical mechanical
  // yards (MECH1/2/3 on most equipment, MY1/2/3 on chillers). Normalize so
  // the facility filter treats them as one group instead of splitting them.
  var FACILITY_ALIAS = { MY1:"MECH1", MY2:"MECH2", MY3:"MECH3" };
  var FACILITY_LABEL = { MECH1:"MECH1 / MY1", MECH2:"MECH2 / MY2", MECH3:"MECH3 / MY3" };
  function normFacility(f){ return f ? (FACILITY_ALIAS[f] || f) : f; }

  var els = {
    search: document.getElementById("search"),
    facilityFilter: document.getElementById("facilityFilter"),
    systemFilter: document.getElementById("systemFilter"),
    subsystemFilter: document.getElementById("subsystemFilter"),
    statusChips: document.getElementById("statusChips"),
    list: document.getElementById("list"),
    emptyMsg: document.getElementById("emptyMsg"),
    stats: document.getElementById("stats")
  };

  var activeStatusFilters = new Set();
  var openRow = null;

  function loadStatus(){
    try{
      var raw = localStorage.getItem("aus01_energization_status");
      statusOverride = raw ? JSON.parse(raw) : {};
    }catch(e){ statusOverride = {}; }
  }
  function saveStatus(){
    try{ localStorage.setItem("aus01_energization_status", JSON.stringify(statusOverride)); }
    catch(e){ /* private mode / storage blocked — status just won't persist */ }
  }
  function getStatus(tag){
    return statusOverride[tag] || (graph.nodes[tag] && graph.nodes[tag].status) || "not_energized";
  }
  function setStatus(tag, status){
    statusOverride[tag] = status;
    saveStatus();
  }

  function loadNotes(){
    try{
      var raw = localStorage.getItem("aus01_energization_notes");
      notesStore = raw ? JSON.parse(raw) : {};
    }catch(e){ notesStore = {}; }
  }
  function saveNotes(){
    try{ localStorage.setItem("aus01_energization_notes", JSON.stringify(notesStore)); }
    catch(e){ /* private mode / storage blocked — notes just won't persist */ }
  }
  function getNotes(tag){ return notesStore[tag] || []; }
  function addNote(tag, text){
    text = text.trim();
    if (!text) return;
    if (!notesStore[tag]) notesStore[tag] = [];
    notesStore[tag].push({ text: text, ts: new Date().toISOString() });
    saveNotes();
  }
  function deleteNote(tag, idx){
    if (!notesStore[tag]) return;
    notesStore[tag].splice(idx, 1);
    if (!notesStore[tag].length) delete notesStore[tag];
    saveNotes();
  }
  function fmtTs(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
             d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    }catch(e){ return iso; }
  }
  function exportNotesText(){
    var lines = [];
    nodeNames.forEach(function(tag){
      var notes = getNotes(tag);
      if (!notes.length) return;
      lines.push("=== " + tag + " ===");
      notes.forEach(function(n){ lines.push("[" + fmtTs(n.ts) + "] " + n.text); });
      lines.push("");
    });
    return lines.length ? lines.join("\n") : "No notes recorded yet.";
  }
  function exportNotes(){
    var text = exportNotesText();
    var blob = new Blob([text], {type:"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "AUS01_walkthrough_notes_" + new Date().toISOString().slice(0,10) + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function upstreamBlocking(tag){
    var node = graph.nodes[tag];
    if (!node) return [];
    return node.fed_by.filter(function(u){
      return graph.nodes[u] && getStatus(u) !== "verified" && getStatus(u) !== "energized";
    });
  }

  function renderStats(){
    var counts = {not_energized:0, loto_applied:0, energized:0, verified:0};
    nodeNames.forEach(function(n){ counts[getStatus(n)] = (counts[getStatus(n)]||0)+1; });
    els.stats.innerHTML =
      '<div class="stat"><b>'+nodeNames.length+'</b> total</div>' +
      '<div class="stat ok"><b>'+counts.verified+'</b> verified</div>' +
      '<div class="stat warn"><b>'+counts.energized+'</b> energized</div>' +
      '<div class="stat danger"><b>'+counts.loto_applied+'</b> LOTO</div>';
  }

  function renderChips(){
    var chips = [
      {key:"not_energized", label:"Not energized"},
      {key:"loto_applied", label:"LOTO applied"},
      {key:"energized", label:"Energized"},
      {key:"verified", label:"Verified"}
    ];
    els.statusChips.innerHTML = chips.map(function(c){
      return '<button class="chip" data-status="'+c.key+'" aria-pressed="'+activeStatusFilters.has(c.key)+'">'+c.label+'</button>';
    }).join("");
    Array.prototype.forEach.call(els.statusChips.querySelectorAll(".chip"), function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-status");
        if (activeStatusFilters.has(k)) activeStatusFilters.delete(k); else activeStatusFilters.add(k);
        renderChips();
        renderList();
      });
    });
  }

  function populateFacilities(){
    var set = new Set();
    nodeNames.forEach(function(n){
      var f = normFacility(graph.nodes[n].facility);
      if (f) set.add(f);
    });
    var arr = Array.from(set).sort();
    els.facilityFilter.innerHTML = '<option value="">All facilities</option>' +
      arr.map(function(f){ return '<option value="'+f+'">'+(FACILITY_LABEL[f]||f)+'</option>'; }).join("");
  }

  function populateSystems(){
    var set = new Set();
    nodeNames.forEach(function(n){
      var s = graph.nodes[n].system;
      if (s) set.add(s);
    });
    var arr = Array.from(set).sort();
    els.systemFilter.innerHTML = '<option value="">All systems</option>' +
      arr.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join("");
  }

  function populateSubsystems(){
    // Grouped by subsystem NAME, not the raw subsystem_id — the register
    // splits some subsystems (e.g. chillers) into multiple numbered IDs of
    // up to 7 units each, which would otherwise list "Chiller" dozens of
    // times. One name = one filter option; matching handles the multiple
    // underlying IDs.
    var sysFilter = els.systemFilter.value;
    var set = new Set();
    nodeNames.forEach(function(n){
      var node = graph.nodes[n];
      if (sysFilter && node.system !== sysFilter) return;
      var name = node.subsystem_name || node.subsystem_id;
      if (name) set.add(name);
    });
    var arr = Array.from(set).sort();
    var current = els.subsystemFilter.value;
    els.subsystemFilter.innerHTML = '<option value="">All subsystems</option>' +
      arr.map(function(n){ return '<option value="'+n+'">'+n+'</option>'; }).join("");
    if (arr.indexOf(current) !== -1) els.subsystemFilter.value = current;
  }

  function matchesFilters(tag){
    var node = graph.nodes[tag];
    var q = els.search.value.trim().toLowerCase();
    if (q){
      var hay = (tag + " " + (node.type||"") + " " + (node.room||"") + " " + (node.facility||"") +
        " " + (node.system||"") + " " + (node.subsystem_name||"") + " " + (node.subsystem_id||"") +
        " " + (node.process_code||"")).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    var fac = els.facilityFilter.value;
    if (fac && normFacility(node.facility) !== fac) return false;
    var sys = els.systemFilter.value;
    if (sys && node.system !== sys) return false;
    var sub = els.subsystemFilter.value;
    if (sub && (node.subsystem_name || node.subsystem_id) !== sub) return false;
    if (activeStatusFilters.size > 0 && !activeStatusFilters.has(getStatus(tag))) return false;
    return true;
  }

  function tagRow(tag, isChainLink){
    return '<div class="tag-link mono" data-jump="'+tag+'"><span class="status-dot '+getStatus(tag)+'"></span>'+tag+'</div>';
  }

  function renderRowBody(tag){
    var node = graph.nodes[tag];
    var blockers = upstreamBlocking(tag);
    var fedBy = node.fed_by || [];
    var feeds = (node.feeds_computed && node.feeds_computed.length ? node.feeds_computed : node.feeds) || [];

    var statusButtons = STATUS_ORDER.map(function(s){
      var active = getStatus(tag) === s;
      var disabled = (s === "energized" || s === "verified") && blockers.length > 0 && !active;
      return '<button class="status-btn '+s+'" data-active="'+active+'" data-set-status="'+s+'" '+(disabled?'disabled title="Blocked — upstream not energized"':'')+'>'+STATUS_LABEL[s]+'</button>';
    }).join("");

    var blockedNote = blockers.length
      ? '<div class="blocked-note">Blocked from energizing — upstream not yet energized: ' + blockers.map(function(b){return '<span class="mono">'+b+'</span>';}).join(", ") + '</div>'
      : "";

    var html =
      '<div class="status-select-wrap"><label>Status</label><div class="status-select">'+statusButtons+'</div></div>' +
      blockedNote +
      '<div class="chain">' +
        '<div><h4>Fed by (upstream, '+fedBy.length+')</h4><div class="taglist">' +
          (fedBy.length ? fedBy.map(function(t){return tagRow(t);}).join("") : '<div class="tag-empty">No upstream source recorded</div>') +
        '</div></div>' +
        '<div><h4>Feeds (downstream, '+feeds.length+')</h4><div class="taglist">' +
          (feeds.length ? feeds.map(function(t){return tagRow(t);}).join("") : '<div class="tag-empty">Nothing recorded downstream</div>') +
        '</div></div>' +
      '</div>' +
      '<div class="meta-line"><span>Type:</span> '+(node.type||"—")+' &nbsp; <span>Room:</span> '+(node.room||"—")+' &nbsp; <span>Rating:</span> '+(node.rating||"—")+' &nbsp; <span>Confidence:</span> '+(node.confidence||"—")+
        '<br><span>System:</span> '+(node.system||"—")+' &nbsp; <span>Subsystem:</span> '+(node.subsystem_name||"—")+' &nbsp; <span>Process:</span> '+(node.process_code||"—")+'</div>' +
      renderNotesSection(tag);
    return html;
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderNotesSection(tag){
    var notes = getNotes(tag);
    var list = notes.length
      ? notes.map(function(n, i){
          return '<div class="note-item"><span class="note-del" data-del-note="'+i+'">delete</span>' +
            '<span class="note-ts">'+fmtTs(n.ts)+'</span>' + esc(n.text) + '</div>';
        }).join("")
      : '<div class="tag-empty">No notes yet — add one from the field below.</div>';
    return (
      '<div class="notes-section" data-notes-for="'+tag+'">' +
        '<h4>Walkthrough notes ('+notes.length+')</h4>' +
        '<div class="notes-list">'+list+'</div>' +
        '<div class="note-add">' +
          '<textarea placeholder="e.g. Breaker labeled but not torqued, confirm with electrician" data-note-input="'+tag+'"></textarea>' +
          '<button data-add-note="'+tag+'">Add note</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderList(){
    var filtered = nodeNames.filter(matchesFilters);
    var LIMIT = 300;
    var shown = filtered.slice(0, LIMIT);

    els.emptyMsg.hidden = filtered.length !== 0;
    if (filtered.length === 0){ els.list.innerHTML = ""; return; }

    els.list.innerHTML = shown.map(function(tag){
      var node = graph.nodes[tag];
      var open = openRow === tag;
      var noteCount = getNotes(tag).length;
      return (
        '<div class="row" data-tag="'+tag+'" data-open="'+open+'">' +
          '<div class="row-head" data-toggle="'+tag+'">' +
            '<span class="chev">▸</span>' +
            '<span class="status-dot '+getStatus(tag)+'"></span>' +
            '<span class="row-name mono">'+tag+'</span>' +
            (noteCount ? '<span class="note-badge" title="'+noteCount+' note(s)">'+noteCount+'</span>' : '') +
            '<span class="row-type">'+(node.type||"—")+'</span>' +
            '<span class="row-meta">'+(node.room||"")+'</span>' +
          '</div>' +
          '<div class="row-body">'+(open ? renderRowBody(tag) : "")+'</div>' +
        '</div>'
      );
    }).join("") + (filtered.length > LIMIT ? '<div class="empty">Showing first '+LIMIT+' of '+filtered.length+' matches — narrow your search.</div>' : "");

    bindRowEvents();
  }

  function bindRowEvents(){
    Array.prototype.forEach.call(els.list.querySelectorAll("[data-toggle]"), function(el){
      el.addEventListener("click", function(){
        var tag = el.getAttribute("data-toggle");
        openRow = (openRow === tag) ? null : tag;
        renderList();
      });
    });
    Array.prototype.forEach.call(els.list.querySelectorAll("[data-set-status]"), function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var row = el.closest(".row");
        var tag = row.getAttribute("data-tag");
        var s = el.getAttribute("data-set-status");
        if (el.disabled) return;
        setStatus(tag, s);
        renderStats();
        renderList();
      });
    });
    Array.prototype.forEach.call(els.list.querySelectorAll("[data-add-note]"), function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var tag = el.getAttribute("data-add-note");
        var ta = els.list.querySelector('[data-note-input="'+tag+'"]');
        if (!ta) return;
        addNote(tag, ta.value);
        renderList();
      });
    });
    Array.prototype.forEach.call(els.list.querySelectorAll("[data-del-note]"), function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var section = el.closest("[data-notes-for]");
        var tag = section.getAttribute("data-notes-for");
        var idx = parseInt(el.getAttribute("data-del-note"), 10);
        deleteNote(tag, idx);
        renderList();
      });
    });
    Array.prototype.forEach.call(els.list.querySelectorAll("[data-jump]"), function(el){
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        var tag = el.getAttribute("data-jump");
        if (!graph.nodes[tag]) return;
        els.search.value = tag;
        activeStatusFilters.clear();
        renderChips();
        openRow = tag;
        renderList();
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });
  }

  function init(data){
    graph = data;
    nodeNames = Object.keys(graph.nodes).sort();
    loadStatus();
    loadNotes();
    populateFacilities();
    populateSystems();
    populateSubsystems();
    renderStats();
    renderChips();
    renderList();

    els.search.addEventListener("input", renderList);
    els.facilityFilter.addEventListener("change", renderList);
    els.systemFilter.addEventListener("change", function(){
      populateSubsystems();
      renderList();
    });
    els.subsystemFilter.addEventListener("change", renderList);
    var exportBtn = document.getElementById("exportNotesBtn");
    if (exportBtn) exportBtn.addEventListener("click", exportNotes);
  }

  function boot(initial){
    var savedStatus = (initial && initial.status) || null;
    var savedNotes = (initial && initial.notes) || null;
    fetch("data.json?v=2").then(function(r){ return r.json(); }).then(function(data){
      if (savedStatus) statusOverride = savedStatus;
      if (savedNotes) notesStore = savedNotes;
      init(data);
    }).catch(function(err){
      document.body.innerHTML = '<div class="empty">Could not load equipment data.<br>'+String(err)+'</div>';
    });
  }

  if (window.claude && window.claude.hot){
    window.claude.hot.snapshot(function(){ return { status: statusOverride, notes: notesStore }; });
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
  } else {
    boot(null);
  }
})();
</script>
